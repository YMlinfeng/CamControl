<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频生成 GSB 盲测系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .btn-selected {
            background-color: #3b82f6 !important; 
            color: white !important;
            border-color: #3b82f6 !important;
            font-weight: bold;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5);
        }
        video::-webkit-media-controls-timeline {
            padding-bottom: 5px;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased min-h-screen flex flex-col items-center py-6">

    <div class="max-w-[1800px] w-[95%] px-4">
        
        <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
            <h1 class="text-2xl font-bold tracking-wider flex items-center gap-2">
                <span>⚖️</span> GSB 多模型综合盲测系统
            </h1>
            <div class="text-lg text-gray-300 bg-gray-800 px-6 py-2 rounded-full border border-gray-700 shadow-inner">
                大盘进度: <span id="video-name" class="text-blue-400 font-mono font-bold">加载中...</span>
            </div>
            <a id="export-link" target="_blank" class="text-sm bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded transition shadow flex items-center gap-2 cursor-pointer">
                <span>📊</span> 导出后台记录
            </a>
        </div>

        <div class="grid grid-cols-2 gap-6 mb-8">
            <div class="flex flex-col items-center bg-gray-800 p-3 rounded-xl shadow-lg border border-gray-700">
                <span class="mb-2 text-xl font-bold text-gray-300">👈 左侧视频</span>
                <video id="vid-left" autoplay loop muted controls class="w-full h-auto rounded-lg shadow-inner"></video>
            </div>
            <div class="flex flex-col items-center bg-gray-800 p-3 rounded-xl shadow-lg border border-gray-700">
                <span class="mb-2 text-xl font-bold text-gray-300">右侧视频 👉</span>
                <video id="vid-right" autoplay loop muted controls class="w-full h-auto rounded-lg shadow-inner"></video>
            </div>
        </div>

        <div id="metrics-container" class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 max-w-5xl mx-auto">
        </div>

        <div class="mt-8 flex justify-center pb-8">
            <button id="submit-btn" onclick="submitEval()" class="bg-blue-600 hover:bg-blue-500 text-white text-xl font-bold py-4 px-16 rounded-full shadow-[0_0_15px_rgba(37,99,235,0.4)] transition-all transform hover:-translate-y-1 hover:shadow-[0_0_25px_rgba(37,99,235,0.6)] disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none">
                ⏳ 正在加载...
            </button>
        </div>
    </div>

    <script>
        const baseUrl = window.location.pathname.endsWith('/') ? window.location.pathname.slice(0, -1) : window.location.pathname;
        document.getElementById('export-link').href = `${baseUrl}/export`;

        const metrics = [
            { id: "camera_motion", name: "🎥 运镜准确度" },
            { id: "image_quality", name: "🖼️ 画面质量" },
            { id: "dynamic_rationality", name: "🏃‍♂️ 动态合理性" },
            { id: "aesthetics", name: "✨ 美学与构图" },
            { id: "overall", name: "🏆 总体综合评分" }
        ];

        let currentTask = null;
        let selections = {};

        function initMetricsUI() {
            const container = document.getElementById('metrics-container');
            container.innerHTML = ''; 
            
            metrics.forEach(m => {
                selections[m.id] = null; 
                const row = document.createElement('div');
                row.className = "flex justify-between items-center mb-4 last:mb-0 pb-4 border-b border-gray-700 last:border-0 last:pb-0";
                row.innerHTML = `
                    <div class="w-1/3 text-lg font-medium text-gray-200 pl-4">${m.name}</div>
                    <div class="w-2/3 flex space-x-4 pr-4">
                        <button onclick="selectMetric('${m.id}', 'Left')" id="btn-${m.id}-Left" class="flex-1 py-3 rounded-lg border border-gray-600 bg-gray-700 text-gray-300 hover:bg-gray-600 hover:text-white transition-all shadow-sm text-lg">左侧更好</button>
                        <button onclick="selectMetric('${m.id}', 'Tie')" id="btn-${m.id}-Tie" class="flex-1 py-3 rounded-lg border border-gray-600 bg-gray-700 text-gray-300 hover:bg-gray-600 hover:text-white transition-all shadow-sm text-lg">平局 / 差不多</button>
                        <button onclick="selectMetric('${m.id}', 'Right')" id="btn-${m.id}-Right" class="flex-1 py-3 rounded-lg border border-gray-600 bg-gray-700 text-gray-300 hover:bg-gray-600 hover:text-white transition-all shadow-sm text-lg">右侧更好</button>
                    </div>
                `;
                container.appendChild(row);
            });
            updateSubmitButton();
        }

        function selectMetric(metricId, choice) {
            selections[metricId] = choice;
            ['Left', 'Tie', 'Right'].forEach(c => {
                const btn = document.getElementById(`btn-${metricId}-${c}`);
                if(btn) btn.classList.remove('btn-selected');
            });
            document.getElementById(`btn-${metricId}-${choice}`).classList.add('btn-selected');
            updateSubmitButton();
        }

        function updateSubmitButton() {
            const allAnswered = Object.values(selections).every(val => val !== null);
            const btn = document.getElementById('submit-btn');
            
            btn.disabled = !allAnswered;
            if(allAnswered) {
                btn.innerText = "✅ 提交并评测下一对";
                btn.classList.replace('bg-blue-600', 'bg-green-600');
                btn.classList.replace('hover:bg-blue-500', 'hover:bg-green-500');
            } else {
                btn.innerText = "请完成所有维度的打分";
                btn.classList.replace('bg-green-600', 'bg-blue-600');
                btn.classList.replace('hover:bg-green-500', 'hover:bg-blue-500');
            }
        }

        async function fetchNextTask() {
            try {
                const res = await fetch(`${baseUrl}/api/get_task`);
                if (!res.ok) {
                    const errorMsg = await res.json();
                    alert(errorMsg.error || "获取任务失败，可能是全部评测完成了！");
                    document.getElementById('submit-btn').disabled = true;
                    document.getElementById('submit-btn').innerText = "🎉 评测任务已全部完成";
                    document.getElementById('video-name').innerText = "评测结束";
                    return;
                }
                currentTask = await res.json();
                
                // 【修改点】：进度条变为全局任务数量统计
                document.getElementById('video-name').innerText = `已评测 ${currentTask.completed_count} / 共 ${currentTask.total_count}`;
                
                const vidLeft = document.getElementById('vid-left');
                const vidRight = document.getElementById('vid-right');
                
                vidLeft.src = `${baseUrl}/${currentTask.left_url}`;
                vidRight.src = `${baseUrl}/${currentTask.right_url}`;
                
                vidLeft.currentTime = 0;
                vidRight.currentTime = 0;
                vidLeft.play().catch(e => console.log("Auto-play blocked", e));
                vidRight.play().catch(e => console.log("Auto-play blocked", e));

                initMetricsUI();
                
            } catch (error) {
                console.error("Error fetching task:", error);
                alert("网络或后端服务异常，请刷新重试！");
            }
        }

        async function submitEval() {
            const allAnswered = Object.values(selections).every(val => val !== null);
            if (!allAnswered) return;

            const payload = {
                task_id: currentTask.task_id,
                video_filename: currentTask.video_filename,
                competitor_name: currentTask.competitor_name,
                is_ours_left: currentTask.is_ours_left,
                metrics: selections
            };

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "🚀 提交中...";

            try {
                const res = await fetch(`${baseUrl}/api/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    await fetchNextTask();
                } else {
                    throw new Error("Server returned " + res.status);
                }
            } catch (error) {
                console.error("Error submitting:", error);
                alert("提交失败，请检查网络或后端是否运行正常。");
                updateSubmitButton(); 
            }
        }

        window.onload = fetchNextTask;
    </script>
</body>
</html>
